name: Backup do banco

# Roda sozinho todo dia às 03:00 (horário de Fortaleza / 06:00 UTC).
# Também pode ser disparado manualmente pela aba "Actions" do GitHub,
# clicando em "Run workflow", útil pra testar sem esperar o horário.
#
# O backup fica guardado como artefato da própria execução, com 30 dias
# de retenção. Pra baixar: aba Actions, abre a execução do dia, seção
# "Artifacts" no fim da página.
#
# Esse workflow já foi "Backup do banco para o Google Drive". O envio pro
# Drive foi removido porque o Google bloqueia os dois caminhos possíveis
# numa conta pessoal (sem Workspace): conta de serviço não tem cota de
# armazenamento no Drive, e o token OAuth de app não publicado é revogado
# logo depois de ser emitido (invalid_grant, confirmado testando o
# refresh direto no endpoint do Google). Se um dia fizer sentido ter uma
# cópia fora do GitHub, o caminho sem essa fragilidade é um bucket
# S3-compatível (Cloudflare R2, Backblaze B2), que usa chave de acesso
# em vez de OAuth.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instala o cliente PostgreSQL 17 (pg_dump compatível com o Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # O pacote genérico "postgresql-client" instala a versão padrão do
          # Ubuntu (16), mais antiga que o servidor do Supabase (17.x), e o
          # pg_dump recusa a dar dump de um servidor mais novo que ele mesmo.
          # Por isso pedimos explicitamente a versão 17 do repositório pgdg.
          sudo apt-get install -y postgresql-client-17

      # Sem esta etapa, um segredo errado só aparece como erro do pg_dump, que
      # fala de socket e de autenticação em vez de falar do que está errado na
      # string. Aqui a string é quebrada em pedaços e só as partes que NÃO são
      # segredo são impressas. A senha nunca é impressa, nem inteira nem em
      # parte, nem mesmo o tamanho dela.
      - name: Confere a string de conexão antes de tentar o dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERRO: o segredo SUPABASE_DB_URL chegou vazio."
            echo "Confira em Settings > Secrets and variables > Actions se ele"
            echo "existe em Repository secrets com esse nome exato."
            exit 1
          fi

          SEM_ESQUEMA="${DATABASE_URL#*://}"
          # Corta no ÚLTIMO arroba, não no primeiro: senha pode conter arroba,
          # e cortar no primeiro partiria a string no lugar errado.
          USERINFO="${SEM_ESQUEMA%@*}"
          DEPOIS_DO_ARROBA="${SEM_ESQUEMA##*@}"
          USUARIO="${USERINFO%%:*}"
          HOSTPORTA="${DEPOIS_DO_ARROBA%%/*}"
          BANCO="${DEPOIS_DO_ARROBA#*/}"
          HOST="${HOSTPORTA%%:*}"
          PORTA="${HOSTPORTA##*:}"

          echo "usuário: $USUARIO"
          echo "host:    $HOST"
          echo "porta:   $PORTA"
          echo "banco:   ${BANCO%%\?*}"
          echo ""

          PROBLEMA=0

          case "$HOST" in
            *pooler.supabase.com)
              # No pooler do Supabase o usuário carrega o código do projeto
              # depois de um ponto, e é ele que diz pro pooler qual projeto
              # atender. Vale conferir aqui porque a mensagem de erro do
              # pooler não ajuda: ela diz "password authentication failed for
              # user postgres" tanto quando a senha está errada quanto em
              # outros casos, sempre citando o papel interno postgres, nunca o
              # usuário que foi realmente enviado.
              case "$USUARIO" in
                postgres.?*) echo "ok: usuário tem o sufixo do projeto" ;;
                *)
                  echo "ERRO: o host é o pooler, mas o usuário é '$USUARIO'."
                  echo "No pooler ele precisa ser 'postgres.CODIGO-DO-PROJETO'."
                  echo "Pegue a string na aba Session pooler usando o botão de"
                  echo "copiar, sem selecionar com o mouse nem digitar à mão."
                  PROBLEMA=1
                  ;;
              esac
              if [ "$PORTA" = "6543" ]; then
                echo "ERRO: porta 6543 é a do Transaction pooler, que não serve"
                echo "pro pg_dump. Use o Session pooler, na porta 5432."
                PROBLEMA=1
              fi
              ;;
            db.*.supabase.co)
              echo "AVISO: esta é a conexão direta. Os servidores do GitHub só"
              echo "falam IPv4 e a conexão direta costuma ser só IPv6. Se o"
              echo "dump falhar por conexão ou DNS, troque pelo Session pooler."
              ;;
          esac

          if [ "$PROBLEMA" -ne 0 ]; then
            exit 1
          fi
          echo "String de conexão com formato válido."

      - name: Gera o dump completo do banco (formato SQL, compactado)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%d_%H-%M-%S)
          FILENAME="harmonize-backup-${TIMESTAMP}.sql"
          # Chama o binário da versão 17 pelo caminho completo: o runner do
          # GitHub já vem com um pg_dump 16 pré-instalado em /usr/bin, e o
          # $PATH resolve pra ele primeiro mesmo depois de instalarmos a
          # versão 17 (que fica em /usr/lib/postgresql/17/bin).
          #
          # --no-owner fica: os papéis donos dos objetos mudam de nome entre
          # projetos Supabase, e sem essa flag a restauração para no primeiro
          # ALTER OWNER pra um papel que não existe no destino.
          #
          # --no-privileges FOI REMOVIDO de propósito, em 21/09/2026, depois
          # de auditar um dump real. Com ela, o arquivo saía sem nenhum GRANT:
          # vinham as tabelas, os dados, o RLS ligado e as políticas, mas
          # nenhuma permissão pros papéis anon/authenticated. Política de RLS
          # decide QUAIS linhas aparecem; o GRANT decide se o papel pode
          # encostar na tabela. Restaurar aquele dump dava um banco íntegro e
          # um aplicativo em que toda consulta respondia "permission denied".
          # Os GRANTs referenciam papéis padrão do Supabase, que existem em
          # qualquer projeto novo, então manter as permissões só ajuda.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner -f "$FILENAME"
          gzip "$FILENAME"
          echo "BACKUP_FILE=${FILENAME}.gz" >> "$GITHUB_ENV"
          echo "BACKUP_SQL=${FILENAME}" >> "$GITHUB_ENV"
          ls -lh "${FILENAME}.gz"

      # Um backup só vale se restaurar um sistema que funciona, e a única
      # forma de saber isso sem restaurar é conferir o conteúdo do arquivo.
      # Esta etapa derruba o workflow quando falta qualquer peça sem a qual
      # a restauração produziria um sistema quebrado. Assim o problema
      # aparece no dia em que nasce, e não no dia em que o banco cair.
      - name: Confere se o dump restauraria um sistema funcionando
        run: |
          set -euo pipefail
          gunzip -c "${BACKUP_FILE}" > conferencia.sql
          FALHOU=0

          exige() {
            # $1 = descrição, $2 = padrão grep, $3 = mínimo de ocorrências
            local qtd
            qtd=$(grep -c "$2" conferencia.sql || true)
            if [ "$qtd" -lt "$3" ]; then
              echo "FALTANDO: $1 (encontrei $qtd, esperava pelo menos $3)"
              FALHOU=1
            else
              echo "ok: $1 ($qtd)"
            fi
          }

          # Permissões: sem elas o aplicativo não lê nada depois de restaurar.
          exige "GRANTs de permissão" "^GRANT" 50
          # Acesso: sem o schema auth e a tabela de usuários, ninguém loga.
          exige "schema auth" "CREATE SCHEMA auth;" 1
          exige "tabela de usuários" "CREATE TABLE auth.users" 1
          exige "dados de usuários" "^COPY auth.users " 1
          # Segurança por linha.
          exige "políticas de RLS" "CREATE POLICY" 20
          # Regras de negócio que moram no banco, não no código.
          exige "função create_rental" "FUNCTION public.create_rental" 1
          exige "função update_rental" "FUNCTION public.update_rental" 1
          exige "função finalize_rental_reservation" "FUNCTION public.finalize_rental_reservation" 1
          exige "função has_module_permission" "FUNCTION public.has_module_permission" 1
          exige "função delete_record_forever" "FUNCTION public.delete_record_forever" 1
          exige "trava de conflito de agenda" "no_equipment_double_booking" 1
          # Modo teste: o código no ar filtra por essa coluna, e sem ela as
          # telas não dão erro, mostram zero, que é pior.
          exige "coluna is_test" "is_test" 5
          # Fonte única dos valores (Leva A): sem as views, as telas de
          # dinheiro também mostram zero silenciosamente.
          exige "view rentals_contabilizaveis" "rentals_contabilizaveis" 1
          exige "view transactions_contabilizaveis" "transactions_contabilizaveis" 1
          # Tabelas de dados principais, com pelo menos uma linha cada.
          for t in clients rentals transactions calendar_events categories settings profiles equipments; do
            exige "dados de public.$t" "^COPY public.$t " 1
          done

          rm -f conferencia.sql
          if [ "$FALHOU" -ne 0 ]; then
            echo ""
            echo "O backup foi gerado, mas restaurá-lo NÃO devolveria um sistema"
            echo "funcionando. Veja os itens marcados como FALTANDO acima."
            exit 1
          fi
          echo ""
          echo "Dump conferido: restauraria um sistema funcionando."

      - name: Guarda o backup como artefato (30 dias de retenção)
        # Roda mesmo se a conferência falhar: um backup com problema ainda é
        # melhor que nenhum, e o arquivo é justamente o que vai ser analisado
        # pra entender o que faltou.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
